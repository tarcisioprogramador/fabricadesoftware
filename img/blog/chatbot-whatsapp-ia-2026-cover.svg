<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Chatbot para WhatsApp Empresarial com IA: Automatize seu Atendimento e Venda 24 Horas por Dia">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="100%" stop-color="#12141E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>

  <!-- decorative -->
  <circle cx="1130" cy="120" r="70" fill="rgba(37,99,235,0.08)"/>
  <circle cx="820" cy="470" r="46" fill="rgba(147,51,234,0.10)"/>
  <circle cx="700" cy="110" r="26" fill="rgba(37,99,235,0.10)"/>
  <circle cx="1000" cy="300" r="180" fill="rgba(37,211,102,0.05)"/>

  <!-- badge -->
  <rect x="100" y="100" width="238" height="42" rx="21" fill="rgba(37,99,235,0.14)"/>
  <circle cx="126" cy="121" r="6" fill="#2563EB"/>
  <text x="144" y="128" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" letter-spacing="1">CHATBOT · IA · 2026</text>

  <!-- title -->
  <text x="100" y="240" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Chatbot para WhatsApp</text>
  <text x="100" y="300" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">com IA: automatize seu</text>
  <text x="100" y="356" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accent)" letter-spacing="-1">atendimento e venda 24h</text>

  <text x="100" y="410" font-family="DM Sans, Arial, sans-serif" font-size="22" fill="#8B8FA3">Qualifique leads e venda enquanto você dorme</text>

  <!-- phone illustration -->
  <g>
    <rect x="870" y="95" width="250" height="400" rx="34" fill="#0D1017" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <rect x="955" y="112" width="80" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>

    <!-- client bubble -->
    <rect x="910" y="140" width="160" height="48" rx="14" fill="#25D366"/>
    <text x="990" y="169" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Quero um orçamento</text>

    <!-- bot bubble -->
    <rect x="895" y="205" width="220" height="72" rx="14" fill="#1B2135" stroke="rgba(255,255,255,0.10)"/>
    <text x="910" y="236" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#CBD5F5">Olá! Sou o assistente virtual.</text>
    <text x="910" y="258" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#CBD5F5">Como posso ajudar hoje?</text>

    <!-- client bubble 2 -->
    <rect x="940" y="294" width="130" height="48" rx="14" fill="#25D366"/>
    <text x="1005" y="323" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Qual o prazo?</text>

    <!-- typing indicator -->
    <rect x="895" y="359" width="110" height="48" rx="14" fill="#1B2135" stroke="rgba(255,255,255,0.10)"/>
    <circle cx="930" cy="383" r="6" fill="#60A5FA">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="383" r="6" fill="#60A5FA">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="383" r="6" fill="#60A5FA">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- AI sparkle -->
    <path transform="translate(850,130) scale(1.4)" fill="#60A5FA" d="M0,-12 C2,-4 4,-2 12,0 C4,2 2,4 0,12 C-2,4 -4,2 -12,0 C-4,-2 -2,-4 0,-12 Z"/>
    <path transform="translate(1140,180) scale(0.9)" fill="#C084FC" d="M0,-12 C2,-4 4,-2 12,0 C4,2 2,4 0,12 C-2,4 -4,2 -12,0 C-4,-2 -2,-4 0,-12 Z"/>

    <!-- whatsapp badge -->
    <circle cx="1085" cy="490" r="48" fill="url(#waGrad)" stroke="#08080C" stroke-width="6"/>
    <g transform="translate(1085,490) scale(1.9) translate(-12,-12)">
      <path fill="#FFFFFF" d="M10 6.5c.3 0 .5.1.7.5l.9 2c.1.3.1.5-.1.7l-.8 1c-.2.2-.2.4-.1.6.5 1 1.6 2.1 2.7 2.6.3.1.5.1.7-.1l.9-.9c.2-.2.5-.3.8-.2l2 .9c.4.2.5.4.5.7 0 .2 0 .5-.1.8-.3.7-1.2 1.4-2 1.5-.4 0-.9.1-2.4-.5-2.1-.9-4.3-3-5.2-5.1-.5-1.2-.6-2.1-.4-2.7.2-.7.9-1.4 1.6-1.7.2-.1.4-.1.6-.1z"/>
    </g>
  </g>

  <!-- brand -->
  <rect x="100" y="492" width="300" height="4" rx="2" fill="url(#accent)"/>
  <text x="100" y="540" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">FÁBRICA DE <tspan fill="url(#accent)">SOFTWARE</tspan></text>
  <text x="800" y="540" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#8B8FA3">Atendimento automático · WhatsApp Business</text>
</svg>
