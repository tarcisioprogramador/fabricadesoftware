<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SEO orgânico em 2026: como aparecer no Google e nas respostas de IA">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="100%" stop-color="#12141E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>

  <!-- decorative -->
  <circle cx="1130" cy="130" r="70" fill="rgba(37,99,235,0.08)"/>
  <circle cx="820" cy="430" r="46" fill="rgba(147,51,234,0.10)"/>
  <circle cx="700" cy="120" r="26" fill="rgba(37,99,235,0.10)"/>

  <!-- badge -->
  <rect x="100" y="104" width="176" height="42" rx="21" fill="rgba(37,99,235,0.14)"/>
  <circle cx="126" cy="125" r="6" fill="#2563EB"/>
  <text x="144" y="132" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#60A5FA" letter-spacing="1">SEO · 2026</text>

  <!-- title -->
  <text x="100" y="248" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">SEO orgânico em 2026:</text>
  <text x="100" y="310" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">como aparecer no Google</text>
  <text x="100" y="368" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accent)" letter-spacing="-1">e nas respostas de IA</text>

  <text x="100" y="420" font-family="DM Sans, Arial, sans-serif" font-size="22" fill="#8B8FA3">Guia prático de otimização para empresas</text>

  <!-- magnifying glass + AI sparkles -->
  <g>
    <circle cx="950" cy="240" r="84" fill="rgba(37,99,235,0.06)" stroke="url(#accent)" stroke-width="10"/>
    <line x1="1012" y1="302" x2="1082" y2="372" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <path transform="translate(950,240) scale(2.1)" fill="#FFFFFF" d="M0,-12 C2,-4 4,-2 12,0 C4,2 2,4 0,12 C-2,4 -4,2 -12,0 C-4,-2 -2,-4 0,-12 Z"/>
    <path transform="translate(902,196) scale(0.9)" fill="#60A5FA" d="M0,-12 C2,-4 4,-2 12,0 C4,2 2,4 0,12 C-2,4 -4,2 -12,0 C-4,-2 -2,-4 0,-12 Z"/>
    <path transform="translate(996,286) scale(0.7)" fill="#C084FC" d="M0,-12 C2,-4 4,-2 12,0 C4,2 2,4 0,12 C-2,4 -4,2 -12,0 C-4,-2 -2,-4 0,-12 Z"/>
  </g>

  <!-- brand -->
  <rect x="100" y="492" width="300" height="4" rx="2" fill="url(#accent)"/>
  <text x="100" y="540" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">FÁBRICA DE <tspan fill="url(#accent)">SOFTWARE</tspan></text>
  <text x="1100" y="540" text-anchor="end" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#8B8FA3">fabricadesoftware · blog</text>
</svg>
